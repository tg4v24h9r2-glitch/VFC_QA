<script>

    function sendSMS() {

        /*
        ============================================
        HÄMTA TEXTSVAR
        ============================================
        */

        const namn =
            document.getElementById('namn').value ||
            'Inget namn angett';

        const traningText =
            document.getElementById('traningText').value ||
            'Inget svar';

        const tranare =
            document.getElementById('tranare').value ||
            'Inget svar';

        const ovrigt =
            document.getElementById('ovrigt').value ||
            'Inget svar';


        /*
        ============================================
        HÄMTA BETYG
        ============================================
        */

        const trivsel =
            document.querySelector(
                'input[name="trivsel"]:checked'
            )?.value || '-';


        const lagkamrater =
            document.querySelector(
                'input[name="lagkamrater"]:checked'
            )?.value || '-';


        const traningScale =
            document.querySelector(
                'input[name="traningScale"]:checked'
            )?.value || '-';


        const matchScale =
            document.querySelector(
                'input[name="matchScale"]:checked'
            )?.value || '-';


        /*
        ============================================
        BYGG SMS-MEDDELANDET
        ============================================
        */

        let msg =
            `Utvärdering fotboll från ${namn}
```

Trivsel i laget (1-5): ${trivsel}
Stämning lagkamrater (1-5): ${lagkamrater}
Träningar (1-5): ${traningScale}

Tankar om träning:
${traningText}

Matcher (1-5): ${matchScale}

Om tränarna:
${tranare}

Övrigt:
${ovrigt}`;

```
        /*
        ============================================
        KODA MEDDELANDET
        ============================================
        */

        const encodedMsg =
            encodeURIComponent(msg);


        /*
        ============================================
        TELEFONNUMMER
        ============================================
        */

        const phoneNumber =
            "0733484197";


        /*
        ============================================
        ÖPPNA SMS-APPEN

        Detta är samma grundprincip som i den
        ursprungliga versionen.
        ============================================
        */

        const isIOS =
            /iPad|iPhone|iPod/.test(
                navigator.userAgent
            ) &&
            !window.MSStream;


        if (isIOS) {

            window.location.href =
                `sms:${phoneNumber}&body=${encodedMsg}`;

        } else {

            window.location.href =
                `sms:${phoneNumber}?body=${encodedMsg}`;

        }

    }

</script>
